<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robert NFT Marketplace</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body { margin:0; font-family:Arial; background: linear-gradient(orange, gold); text-align:center; color:black; }
.header { background:#000; padding:15px; display:flex; justify-content:space-between; align-items:center; }
.header h1 { color:gold; margin:0; }
.login-btn { background:gold; border:none; padding:10px 20px; border-radius:8px; font-weight:bold; cursor:pointer; }
.hero { padding:80px 20px; }
.hero h1 { font-size:40px; }
.hero button { padding:15px 30px; font-size:18px; border:none; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>
<header class="header">
<h1>🚀 ROBERT NFT MARKETPLACE</h1>
<button class="login-btn" id="pi-login-btn">Connect Pi Wallet</button>
</header>

<section class="hero">
<h1>The Home of Pi NFTs</h1>
<p>Buy, Sell, and Mint Exclusive NFTs using Pi Coin</p>
<button id="explore-btn">Start Exploring</button>
</section>

<h2>🔥 Featured NFTs</h2>

<script>
// 1. INIT PI
Pi.init({ version: "2.0", sandbox: true });

let currentUser = null;

// 2. LOGIN BUTTON
document.getElementById('pi-login-btn').addEventListener('click', function() {
    Pi.authenticate(['username', 'payments'], onIncompletePaymentFound)
    .then(function(auth) {
        currentUser = auth.user;
        document.getElementById('pi-login-btn').innerText = "Hi " + auth.user.username;
        alert("Welcome " + auth.user.username + "!");
    }).catch(function(error) {
        alert("Login failed");
    });
});

// 3. EXPLORE BUTTON -> PUPUNTA SA MARKETPLACE
document.getElementById('explore-btn').addEventListener('click', function() {
    window.location.href = "marketplace.html"; 
});

function onIncompletePaymentFound(payment) { console.log(payment); }
</script>
</body>
</html>
